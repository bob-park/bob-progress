<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Task Progress — 캐릭터 목업</title>
<style>
  :root { --bg:#141413; --panel:#1f1e1d; --line:#3a3936; --fg:#e8e6df; --dim:#8a8780; --clay:#D97757; }
  * { box-sizing:border-box }
  body { margin:0; padding:28px 36px 60px; background:var(--bg); color:var(--fg); font:14px/1.5 -apple-system, "Apple SD Gothic Neo", sans-serif }
  h2 { margin:0 0 4px; font-size:20px }
  h3 { margin:32px 0 10px; font-size:15px; color:var(--clay) }
  .sub { color:var(--dim); margin:0 0 18px }
  .controls { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-bottom:16px }
  .controls button { background:var(--panel); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:4px 10px; cursor:pointer; font:inherit; font-size:13px }
  .controls button.sel { border-color:var(--clay); color:var(--clay) }
  .controls .sep { width:12px }
  .split { display:flex; gap:28px; flex-wrap:wrap; align-items:flex-start }
  .col { display:flex; flex-direction:column; gap:6px }
  .label { font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--dim) }

  /* desktop pane */
  .dpane { width:420px; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 16px }
  .dhead { display:flex; justify-content:space-between; font-weight:700; color:#f2c94c; margin-bottom:8px }
  .dhead .path { color:#e056fd; font-size:12px }
  .drow { display:flex; align-items:center; gap:8px; padding:3px 0; color:var(--dim); font-size:13px }
  .drow.done { color:#5fbf8f }
  .drow .t { margin-left:auto; font-variant-numeric:tabular-nums }
  .drow svg { flex-shrink:0 }
  .dcur { display:flex; gap:12px; align-items:center; background:#2a2826; border:1px solid #4a3a30; border-radius:10px; padding:8px 10px; margin:4px 0 }
  .dcur .info { flex:1; min-width:0 }
  .dcur .name { display:flex; justify-content:space-between; font-weight:700; color:#f2c94c }
  .dcur .name .t { color:var(--fg); font-weight:400; font-variant-numeric:tabular-nums }
  .dbar { height:6px; border-radius:3px; background:#3a3936; margin:6px 0 4px; overflow:hidden; position:relative }
  .dbar i { position:absolute; left:0; top:0; bottom:0; width:43%; background:#f2c94c; border-radius:3px }
  .dcur .task { font-size:12px; color:var(--dim) }
  .dagent { display:flex; align-items:center; gap:8px; font-size:12px; padding:2px 0 2px 18px; border-left:1px dashed var(--line); margin-left:22px }
  .dagent .t { margin-left:auto; color:var(--dim); font-variant-numeric:tabular-nums }
  .dagent .ok { color:#5fbf8f }

  /* terminal pane */
  pre.term { margin:0; padding:12px 14px; background:#0d0d0c; border:1px solid var(--line); border-radius:8px; font:13px/1.25 "SF Mono", Menlo, monospace; color:var(--fg) }

  /* cast gallery */
  .cast { display:grid; grid-template-columns:repeat(auto-fill, minmax(170px, 1fr)); gap:12px }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px; display:flex; flex-direction:column; align-items:center; gap:6px }
  .card .nm { font-weight:700 }
  .card .ds { font-size:12px; color:var(--dim); text-align:center }
  .card pre.term { padding:6px 8px; font-size:12px }

  /* sprite animation: only while working (.on) */
  svg.px { shape-rendering:crispEdges; overflow:visible }
  svg.px g { transform-box:fill-box }
  .on .la { animation:st .5s steps(1) infinite }
  .on .lb { animation:st .5s steps(1) infinite -.25s }
  .on .bd { animation:bob .5s steps(1) infinite -.125s }
  @keyframes st { 50% { transform:translateY(-1px) } }
  @keyframes bob { 50% { transform:translateY(1px) } }
  .on .swing { transform-origin:50% 100%; animation:swing .5s steps(1) infinite }
  @keyframes swing { 0% { transform:rotate(-40deg) } 50% { transform:rotate(30deg) } }
  .spark { opacity:0 }
  .on .spark { animation:spark .5s steps(1) infinite }
  @keyframes spark { 50% { opacity:1 } }
  .on .scan { animation:scan 1.6s steps(1) infinite }
  @keyframes scan { 0% { transform:translateX(0) } 25% { transform:translateX(-3px) } 50% { transform:translateX(-6px) } 75% { transform:translateX(-3px) } }
  .on .b1 { animation:blink 1.5s steps(1) infinite }
  .on .b2 { animation:blink 1.5s steps(1) infinite .5s }
  .on .b3 { animation:blink 1.5s steps(1) infinite 1s }
  @keyframes blink { 0% { opacity:1 } 33% { opacity:.15 } }
  .on .quill { transform-origin:0% 100%; animation:quill .5s steps(1) infinite }
  @keyframes quill { 50% { transform:rotate(-15deg) translateX(-1px) } }
  .on .w1 { animation:show 2s steps(1) infinite }
  .on .w2 { animation:show 2s steps(1) infinite .66s }
  .on .w3 { animation:show 2s steps(1) infinite 1.33s }
  @keyframes show { 0% { opacity:0 } 30% { opacity:1 } }
  .on .pencil { animation:draw 1s steps(1) infinite }
  @keyframes draw { 25% { transform:translate(-1px,1px) } 50% { transform:translate(-2px,0) } 75% { transform:translate(-1px,-1px) } }
  .on .grow { transform-origin:50% 100%; animation:grow 2s steps(1) infinite }
  @keyframes grow { 0% { transform:scaleY(.25) } 33% { transform:scaleY(.6) } 66% { transform:scaleY(1) } }
  .on .wave { transform-origin:0% 50%; animation:wave .25s steps(1) infinite }
  @keyframes wave { 50% { transform:skewY(15deg) } }
  .on .c1 { animation:blink .8s steps(1) infinite }
  .on .c2 { animation:blink .8s steps(1) infinite .4s }
  .on .hop { animation:hop .4s steps(1) infinite }
  @keyframes hop { 50% { transform:translateY(-1px) } }
  .on .ant { animation:blink .8s steps(1) infinite }
  @media (prefers-reduced-motion: reduce) { .on * { animation:none !important } }
</style>
</head>
<body>
<h2>진행 중인 작업: 단계별 캐릭터 목업</h2>
<p class="sub">각 superpowers 단계는 서로 다른 Clawd가 맡고, 서브에이전트는 작은 로봇 “비트”로 따로 나옵니다. 일하는 동안만 움직이고, 대기 중이면 멈춥니다. 아래 버튼으로 현재 단계와 상태를 바꿔 볼 수 있어요.</p>

<div class="controls" id="stageBtns"></div>

<h3>1. 패널 안에서 — 데스크톱 앱 / 터미널</h3>
<div class="split">
  <div class="col"><span class="label">데스크톱 앱 (SVG 픽셀 + CSS 애니메이션)</span><div class="dpane" id="dpane"></div></div>
  <div class="col"><span class="label">터미널 (문자 캐릭터, 100ms 프레임)</span><pre class="term" id="tpane"></pre></div>
</div>

<h3>2. 단계별 캐릭터</h3>
<div class="cast" id="cast"></div>

<h3>3. 서브에이전트 캐릭터 “비트” (역할마다 색과 도구)</h3>
<div class="cast" id="bots"></div>

<script>
// ---------- pixel sprites ----------
const C = { '#':'#D97757', K:'#1F1E1D', Y:'#F2C94C', y:'#B8901E', B:'#8B5A2B', G:'#A3A8AE', W:'#F5F3EE', w:'#B9B6AE',
            U:'#4A90D9', u:'#9CC3EE', P:'#9B6BD6', g:'#5FBF6F', T:'#D9B77E', R:'#E5534B', M:'#E056FD', L:'#9ED8F5' }
const layer = (rows, x, y, cls = '', over = {}) => {
  let s = `<g class="${cls}">`
  rows.forEach((r, j) => [...r].forEach((ch, i) => {
    const col = over[ch] ?? C[ch]
    if (ch !== '.' && col) s += `<rect x="${x + i}" y="${y + j}" width="1" height="1" fill="${col}"/>`
  }))
  return s + '</g>'
}
const BODY = ['..##########..', '..#K######K#..', '##############', '..##########..', '..##########..']
const LA = ['..#........#..', '..#........#..'], LB = ['....#....#....', '....#....#....']
const clawd = (hat, props) =>
  `<g class="bd">${layer(BODY, 4, 6)}${hat}</g>${layer(LA, 4, 11, 'la')}${layer(LB, 4, 11, 'lb')}${props}`

const STAGES = {
  brainstorm: { ko:'생각쟁이', ds:'생각 거품이 차례로 떠오름', color:'#C792EA',
    svg: clawd('', layer(['W'], 18, 5, 'b1') + layer(['WW', 'WW'], 19, 2, 'b2') + layer(['WWW', 'WWW'], 21, -1, 'b3')) },
  spec: { ko:'서기', ds:'깃펜으로 종이에 한 줄씩 씀', color:'#E8E6DF',
    svg: clawd(layer(['...W', '..WW', '.WW.'], 13, 3, 'quill2'),
      layer(['WWWW', 'W..W', 'W..W', 'W..W', 'WWWW'], 0, 7) + layer(['ww'], 1, 8, 'w1') + layer(['ww'], 1, 9, 'w2') + layer(['ww'], 1, 10, 'w3')
      + layer(['...W', '..WW', '.WW.', 'B...'], 18, 4, 'quill')) },
  plan: { ko:'설계사', ds:'베레모 쓰고 청사진에 연필질', color:'#4A90D9',
    svg: clawd(layer(['....PP....', '.PPPPPPPP.', 'PPPPPPPPPP'], 6, 3),
      layer(['UUUUU', 'UuUuU', 'UUUUU', 'UuUuU', 'UUUUU'], 18, 7) + layer(['.Y', '.Y', 'K.'], 20, 4, 'pencil')) },
  worktree: { ko:'정원사', ds:'밀짚모자, 새싹(브랜치)이 자람', color:'#5FBF6F',
    svg: clawd(layer(['....TTTTTT....', '....yyyyyy....', 'TTTTTTTTTTTTTT'], 4, 3),
      layer(['g.g', '.g.', '.g.', '.g.'], 19, 7, 'grow') + layer(['RRR', '.R.'], 19, 11)) },
  execute: { ko:'건설공', ds:'안전모 쓰고 망치질, 불꽃 튐', color:'#F2C94C',
    svg: clawd(layer(['...YYYYYY...', '.YYYYYYYYYY.', 'YYYYYYYYYYYY'], 5, 3),
      layer(['GGG', '.B.', '.B.', '.B.', '.B.'], 18, 3, 'swing') + layer(['Y.Y', '.Y.', 'Y.Y'], 21, 9, 'spark')) },
  review: { ko:'탐정', ds:'사냥모자, 돋보기로 훑어봄', color:'#D9B77E',
    svg: clawd(layer(['...BTBTBT...', '..TBTBTBTB..', 'BBTBTBTBTBBB'], 5, 3),
      layer(['.GG.', 'GLLG', 'GLLG', '.GG.', '...B', '....B'], 18, 6, 'scan')) },
  finish: { ko:'축하꾼', ds:'고깔모자, 체커 깃발 펄럭', color:'#E056FD',
    svg: clawd(layer(['..MM..', '..WW..', '.MMMM.', 'MMMMMM'], 8, 2),
      layer(['w', 'w', 'w', 'w', 'w', 'w', 'w', 'w'], 18, 2) + layer(['KWK', 'WKW', 'KWK'], 19, 2, 'wave')
      + layer(['M...Y', '.....', '..L..'], 0, 1, 'c1') + layer(['..Y..', '.....', 'L...M'], 0, 3, 'c2')) },
}
const ORDER = Object.keys(STAGES)
const sprite = (svg, scale, on) =>
  `<svg class="px ${on ? 'on' : ''}" viewBox="0 -1 25 15" width="${25 * scale}" height="${15 * scale}">${svg}</svg>`

// sub-agent bot "Bit": a different creature, colored by role
const ROLES = {
  impl:   { color:'#378ADD', tool:['..G', '.GG', 'G..'], ko:'구현', ds:'렌치를 들고 깡충' },
  review: { color:'#E0A030', tool:['.GG', 'GLG', '.GB'], ko:'리뷰', ds:'작은 돋보기' },
  fix:    { color:'#E5534B', tool:['.W.', 'WWW', '.W.'], ko:'수정', ds:'반창고(+) 들고 수리' },
  agent:  { color:'#1D9E75', tool:['..', '..', '..'],     ko:'일반 에이전트', ds:'Explore 등 그 밖의 에이전트' },
}
const BOT = ['....a.....', '....w.....', '..XXXXXX..', '.XXXXXXXX.', '.XKXXXXKX.', '.XXXXXXXX.', '..XXXXXX..']
const bot = (role, scale, on, done) => {
  const r = ROLES[role]
  const body = layer(BOT.slice(1), 0, 1, '', { X:r.color }) + layer(done ? ['..g.g...', '...g....'] : ['........'], 1, 4, '', {})
  const svg = `<g class="hop">${layer([BOT[0]], 0, 0, 'ant', { a:r.color })}${body}${layer(r.tool, 10, 3)}</g>`
    + layer(['..w....w..'], 0, 8)
  return `<svg class="px ${on ? 'on' : ''}" viewBox="0 -1 14 10" width="${14 * scale}" height="${10 * scale}">${svg}</svg>`
}

// ---------- terminal characters ----------
const TC = { clay:'#D97757', dim:'#7a776f', green:'#5fbf8f', yellow:'#f2c94c', mag:'#e056fd', blue:'#61afef', red:'#e5534b', fg:'#e8e6df', cyan:'#56b6c2', brown:'#c8a26b' }
// each stage: a hat line and a 2-col prop column (4 lines) per frame
const TSTAGE = {
  brainstorm: { hat:['         ', 'fg'], props:[['   ', '   ', '   ', '   '], ['   ', '   ', '°  ', '   '], ['   ', ' o ', '°  ', '   '], [' O ', ' o ', '°  ', '   ']], pc:'fg' },
  spec:       { hat:['     ╱   ', 'fg'], props:[['   ', '   ', '✎  ', '   '], ['   ', '   ', '─✎ ', '   '], ['   ', '   ', '──✎', '   '], ['   ', '   ', '───', '   ']], pc:'fg' },
  plan:       { hat:['  ▄▀▀▀▄  ', 'mag'], props:[['   ', '┌┬┐', '├✎┤', '└┴┘'], ['   ', '┌✎┐', '├┼┤', '└┴┘'], ['   ', '┌┬┐', '├┼✎', '└┴┘'], ['   ', '┌┬┐', '├┼┤', '└✎┘']], pc:'blue' },
  worktree:   { hat:[' ▁▄▄▄▄▄▁ ', 'brown'], props:[['   ', '   ', '   ', ' ▄ '], ['   ', '   ', ' ı ', ' ▄ '], ['   ', ' ╷ ', ' │ ', ' ▄ '], ['   ', '╲╿╱', ' │ ', ' ▄ ']], pc:'green' },
  execute:    { hat:['  ▄███▄  ', 'yellow'], props:[['╺┳╸', ' ┃ ', '   ', '   '], ['   ', '━┫ ', '  ✦', '   ']], pc:'yellow' },
  review:     { hat:[' ▗▛▀▀▀▜▖ ', 'brown'], props:[['   ', '◎  ', ' ╲ ', '   '], ['   ', ' ◎ ', '  ╲', '   '], ['   ', '  ◎', '  ╲', '   '], ['   ', ' ◎ ', '  ╲', '   ']], pc:'cyan' },
  finish:     { hat:['    ▲    ', 'mag'], props:[['|▶ ', '|  ', '|  ', '|  '], ['|▷ ', '| *', '|  ', '|  ']], pc:'red' },
}
const BODY_T = [' ▐▛███▜▌ ', '▝▜█████▛▘']
const FEET = ['  ▘▘ ▝▝  ', '  ▝▝ ▘▘  ']
// 4 lines of [text,color] segments for a stage character at frame f
const tChar = (stage, f, on) => {
  const s = TSTAGE[stage], k = on ? f : 0
  const p = s.props[Math.floor(k / 3) % s.props.length]
  const lines = [[s.hat[0], s.hat[1]], [BODY_T[0], 'clay'], [BODY_T[1], 'clay'], [FEET[on ? Math.floor(k / 5) % 2 : 0], 'clay']]
  const out = lines.map((l, i) => [l, [p[i], s.pc]])
  return out
}
const BOTT = {
  impl:   { run:['[•_•]⚙', '[•_•]✲'], c:'blue' },
  review: { run:['[•_•]⌕', '[•_•] ⌕'], c:'yellow' },
  fix:    { run:['[•_•]✚', '[•‸•]✚'], c:'red' },
  agent:  { run:['[•_•]»', '[•_•] »'], c:'green' },
}
const tBot = (role, f, on, done) => done ? ['[^_^]✓', 'green'] : [BOTT[role].run[on ? Math.floor(f / 3) % 2 : 0], BOTT[role].c]
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')
const segHtml = segs => segs.map(([t, c]) => `<span style="color:${TC[c] ?? c}">${esc(t)}</span>`).join('')
const len = segs => segs.reduce((n, [t]) => n + [...t].length, 0)

// ---------- state ----------
let cur = 'execute', on = true, f = 0
const SPIN = '⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏'
const TIMES = { brainstorm:'04:10', spec:'01:02', plan:'03:30', worktree:'00:20', execute:'05:02', review:'02:41', finish:'' }
const AGENTS = {
  brainstorm: [['review', 'review spec', 'approved 00:38', true]],
  plan: [],
  execute: [['impl', 'impl #4', 'Haiku 5.5 01:12', false], ['review', 'review #3', 'approved 00:41', true], ['agent', 'Explore auth', 'Haiku 5.5 00:20', false]],
  review: [['review', 'review branch', 'Opus 5.5 01:40', false], ['fix', 'fix #2', 'Sonnet 5.5 00:31', false]],
}

const btns = document.getElementById('stageBtns')
const drawBtns = () => {
  btns.innerHTML = '<span class="label">현재 단계</span>' + ORDER.map(s => `<button class="${s === cur ? 'sel' : ''}" data-s="${s}">${s}</button>`).join('')
    + `<span class="sep"></span><button class="${on ? 'sel' : ''}" data-on="1">일하는 중</button><button class="${on ? '' : 'sel'}" data-on="0">대기</button>`
}
btns.onclick = e => {
  const b = e.target.closest('button'); if (!b) return
  if (b.dataset.s) cur = b.dataset.s
  if (b.dataset.on) on = b.dataset.on === '1'
  drawBtns(); drawDesktop(); drawCast()
}

const drawDesktop = () => {
  const ci = ORDER.indexOf(cur)
  let h = `<div class="dhead"><span>⚡ SUPERPOWERS</span><span class="path">PROJECT</span></div>`
  ORDER.forEach((s, i) => {
    if (i === ci) {
      const ag = AGENTS[s] ?? []
      h += `<div class="dcur">${sprite(STAGES[s].svg, 4, on)}<div class="info">
        <div class="name"><span>${s} · ${STAGES[s].ko}</span><span class="t">${TIMES[s] || '00:12'}</span></div>
        ${s === 'execute' ? '<div class="dbar"><i></i></div><div class="task">3/7 · #4 Add verdict parser</div>' : `<div class="task">${STAGES[s].ds}</div>`}
      </div></div>`
      ag.forEach(([role, name, meta, done]) => {
        h += `<div class="dagent">${bot(role, 2, on && !done, done)}<span>${name}</span><span class="t ${done ? 'ok' : ''}">${meta}</span></div>`
      })
    } else {
      const done = i < ci
      h += `<div class="drow ${done ? 'done' : ''}">${done ? sprite(STAGES[s].svg, 1, false) : '<span style="width:25px;text-align:center">○</span>'}<span>${done ? '✓ ' : ''}${s}</span><span class="t">${done ? TIMES[s] : ''}</span></div>`
    }
  })
  document.getElementById('dpane').innerHTML = h
}

const W = 46
const drawTerm = () => {
  const ci = ORDER.indexOf(cur), rows = []
  const push = segs => rows.push(segs)
  const right = (l, r) => [...l, [' '.repeat(Math.max(1, W - 4 - len(l) - len(r))), 'fg'], ...r]
  ORDER.forEach((s, i) => {
    if (i < ci) push(right([['✓ ' + s, 'green']], [[TIMES[s], 'green']]))
    else if (i > ci) push([['○ ' + s, 'dim']])
    else {
      const ch = tChar(s, f, on)
      const mark = on ? SPIN[f % SPIN.length] : '●'
      const side = [
        right([[`${mark} ${s}`, 'yellow']], [[TIMES[s] || '00:12', 'fg']]),
        s === 'execute' ? [['███▓▓', 'yellow'], ['░░░░░░', 'dim'], [' 3/7', 'fg']] : [[STAGES[s].ko, 'dim']],
        s === 'execute' ? [['#4 Add verdict parser', 'fg']] : [],
        [],
      ]
      ch.forEach((segs, j) => push(fit([...segs, ['  ', 'fg']], side[j])))
      ;(AGENTS[s] ?? []).forEach(([role, name, meta, done]) => {
        const b = tBot(role, f, on && !done, done)
        push(right([['│ ', 'dim'], b, [' ' + name, 'fg']], [[meta, done ? 'green' : 'dim']]))
      })
    }
  })
  const top = [['╭ ', 'yellow'], ['⚡ SUPERPOWERS', 'yellow'], [' ' + '─'.repeat(W - 27) + ' ', 'yellow'], ['PROJECT', 'mag'], [' ─╮', 'yellow']]
  const body = rows.map(r => segHtml([['│ ', 'yellow'], ...r, [' '.repeat(Math.max(0, W - 4 - len(r))), 'fg'], [' │', 'yellow']]))
  const bottom = segHtml([['╰' + '─'.repeat(W - 2) + '╯', 'yellow']])
  document.getElementById('tpane').innerHTML = [segHtml(top), ...body, bottom].join('\n')
}
// character block (12 cols) + side text, side right part aligned inside
function fit(charSegs, side) {
  const avail = W - 4 - len(charSegs)
  if (!side.length) return charSegs
  // side may contain a spacer from right(); recompute for narrower width
  const flat = side.filter(([t]) => !/^ +$/.test(t))
  if (side.length !== flat.length) {
    const [l, r] = [flat.slice(0, 1), flat.slice(1)]
    return [...charSegs, ...l, [' '.repeat(Math.max(1, avail - len(l) - len(r))), 'fg'], ...r]
  }
  return [...charSegs, ...side]
}

const drawCast = () => {
  document.getElementById('cast').innerHTML = ORDER.map(s => `<div class="card">${sprite(STAGES[s].svg, 4, on)}
    <pre class="term" data-stage="${s}"></pre><span class="nm" style="color:${STAGES[s].color}">${s} · ${STAGES[s].ko}</span><span class="ds">${STAGES[s].ds}</span></div>`).join('')
  document.getElementById('bots').innerHTML = Object.entries(ROLES).map(([k, r]) => `<div class="card">${bot(k, 5, on, false)}
    <pre class="term" data-bot="${k}"></pre><span class="nm" style="color:${r.color}">${k} · ${r.ko}</span><span class="ds">${r.ds}<br>끝나면 [^_^]✓ 로 멈춤</span></div>`).join('')
}
const tickCast = () => {
  document.querySelectorAll('pre[data-stage]').forEach(p => { p.innerHTML = tChar(p.dataset.stage, f, on).map(segHtml).join('\n') })
  document.querySelectorAll('pre[data-bot]').forEach(p => { p.innerHTML = segHtml([tBot(p.dataset.bot, f, on, false)]) })
}

drawBtns(); drawDesktop(); drawCast()
setInterval(() => { f++; drawTerm(); tickCast() }, 100)
</script>
